name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      # The Firestore/Auth emulators run on a JVM -- required for the rules
      # test suite below, not for anything else in this job.
      - name: Set up Java (required by the Firestore/Auth emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firestore/Auth emulator security-rules tests
        run: npm run test:rules

      - name: Install Playwright browser (Chromium only)
        run: npx playwright install --with-deps chromium

      # test:e2e builds a dedicated emulator-only bundle first (`vite build
      # --mode test`, forced via the committed .env.test) and only ever
      # starts a local preview server against it -- this step can never
      # reach the real arconnect-7337f project.
      - name: End-to-end tests
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
